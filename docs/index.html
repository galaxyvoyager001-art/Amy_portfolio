<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amy Hu · Portfolio</title>
<meta name="description" content="Amy Hu — a portfolio for the senses: tactile books, a miniature house, the physics of baking, guzheng and taekwondo, and research & entrepreneurship.">
<meta property="og:title" content="Amy Hu · Portfolio">
<meta property="og:image" content="pages/p01.jpg">
<style>
  :root { --bg: #1b1d22; --fg: #f3efe6; --muted: #a7a399; --accent: #ff6b3d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px clamp(16px, 4vw, 48px); background: rgba(27,29,34,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.08); }
  .name { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
  .name b { color: var(--accent); font-weight: 600; }
  .actions { display: flex; gap: 10px; align-items: center; }
  .btn { color: var(--fg); text-decoration: none; font-size: 14px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1b1d22; font-weight: 600; }
  .btn:hover { border-color: var(--fg); }
  .count { color: var(--muted); font-size: 13px; }
  main { max-width: 1600px; margin: 0 auto; padding: clamp(16px, 3vw, 40px) clamp(16px, 4vw, 48px) 80px;
    display: flex; flex-direction: column; gap: clamp(16px, 2.4vw, 32px); }
  figure { margin: 0; }
  figure img { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; background: #2a2d33;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); cursor: zoom-in; }
  figcaption { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding-top: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 48px; }
  #lb { position: fixed; inset: 0; background: rgba(10,10,12,.96); display: none; align-items: center; justify-content: center; z-index: 10; }
  #lb.on { display: flex; }
  #lb img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  #lb button { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.1); color: #fff;
    border: 0; font-size: 28px; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; }
  #lb .prev { left: 14px; } #lb .next { right: 14px; }
  #lb .close { top: 30px; right: 14px; transform: none; font-size: 22px; }
  @media (max-width: 600px) { .count { display: none; } .name { font-size: 13px; } }
</style>
</head>
<body>
<header>
  <div class="name">Amy Hu <b>/</b> Portfolio</div>
  <div class="actions">
    <span class="count">22 pages</span>
    <a class="btn primary" href="Amy_Hu_Portfolio.pdf" download>Download PDF</a>
  </div>
</header>
<main id="pages"></main>
<footer>Amy Hu · Touch · Sight · Taste · Sound &amp; Motion · Mind — click any page to enlarge</footer>
<div id="lb" role="dialog" aria-label="Page viewer">
  <img alt="">
  <button class="prev" aria-label="Previous page">‹</button>
  <button class="next" aria-label="Next page">›</button>
  <button class="close" aria-label="Close">✕</button>
</div>
<script>
  const titles = ["Cover","Contents","Touch · Even Without Sight","Touch · Design drawings","Touch · Making","Touch · The books",
    "Touch · The visits","Touch · Exhibition","Sight · A house in miniature","Sight · Look closer","Taste · The Physics of Baking",
    "Taste · Twelve bakes","Sound & Motion","Research & Entrepreneurship","IYPT · Coupled pendulums","CYPT · Damping & levitation",
    "SmartHearing","Metallic glass","Curawave","Lingtong · the company","Experimental optics","Modelling & publishing"];
  const main = document.getElementById('pages');
  titles.forEach((t, i) => {
    const n = String(i + 1).padStart(2, '0');
    const f = document.createElement('figure');
    f.innerHTML = `<img src="pages/p${n}.jpg" alt="Page ${n}: ${t}" loading="${i < 2 ? 'eager' : 'lazy'}" width="2560" height="1280"><figcaption>${n} · ${t}</figcaption>`;
    f.querySelector('img').addEventListener('click', () => open(i));
    main.appendChild(f);
  });
  const lb = document.getElementById('lb'), lbImg = lb.querySelector('img');
  let cur = 0;
  function show(i) { cur = (i + titles.length) % titles.length; const n = String(cur + 1).padStart(2, '0'); lbImg.src = `pages/p${n}.jpg`; lbImg.alt = `Page ${n}: ${titles[cur]}`; }
  function open(i) { show(i); lb.classList.add('on'); }
  function close() { lb.classList.remove('on'); }
  lb.querySelector('.prev').onclick = e => { e.stopPropagation(); show(cur - 1); };
  lb.querySelector('.next').onclick = e => { e.stopPropagation(); show(cur + 1); };
  lb.querySelector('.close').onclick = close;
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('on')) return;
    if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1);
  });
</script>
</body>
</html>
